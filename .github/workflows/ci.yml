# Continuous integration on every push to dev and every pull request into dev: the CADCraft
# workspace (formatting, lints, tests) and the ECAD workspace in ecad/ (`cargo xtask ci` and plain
# `cargo test --workspace`) on Linux and natively on Windows.
# Green CI is required before review; it is not approval to merge.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Debug info and incremental caches push a full workspace build past 25 GB, more than a
  # hosted runner's disk; without them it is a fraction of that.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install windowing libraries for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  ecad:
    name: ECAD workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The upstream patch guard diffs against the incorporated CADCraft commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ecad
      - name: fmt, clippy, tests, layers, patch guard, wasm
        working-directory: ecad
        run: cargo xtask ci
      - name: Tests without extra features
        working-directory: ecad
        run: cargo test --workspace

  ecad-windows:
    name: ECAD workspace (Windows)
    runs-on: windows-latest
    steps:
      # ECAD files are LF (ecad/CLAUDE.md); the runner's Git would otherwise check out CRLF.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          # The upstream patch guard diffs against the incorporated CADCraft commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ecad
      - name: fmt, clippy, tests, layers, patch guard, wasm
        working-directory: ecad
        run: cargo xtask ci
      - name: Tests without extra features
        working-directory: ecad
        run: cargo test --workspace
