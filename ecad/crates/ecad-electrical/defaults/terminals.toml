# Brief 036: terminals.
# Built-in defaults (brief 066, design 066 §3). Values only: each key's kind, range, levels and
# label stay in the registry (`src/defaults/`), so this file cannot widen what is allowed.
# Keys under [values] are registry keys; lengths are millimetres. [fields.<catalogue>] are a style
# field's built-in, [styles.<catalogue>.<id>] a built-in style's values.

[values]
"terminal.level.separator" = "."
"terminal.x2.levels" = "1,2"
"terminal.x2b.levels" = "1,2"
"terminal.x3.levels" = "1,2,3"
"terminal.lnpe.levels" = "L,N,PE"
"terminal.sen.levels" = "S,+,-"
"terminal.ft.description" = "Feed-through terminal"
"terminal.pe.description" = "PE terminal"
"terminal.x2.description" = "Two-level terminal"
"terminal.x2b.description" = "Two-level terminal, bridged"
"terminal.x3.description" = "Three-level terminal"
"terminal.lnpe.description" = "L/N/PE terminal"
"terminal.sen.description" = "Sensor terminal"
"terminal.dis.description" = "Disconnect terminal"
"terminal.fuse.description" = "Fuse terminal"
