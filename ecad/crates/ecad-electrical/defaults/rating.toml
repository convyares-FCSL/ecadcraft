# Wire and cable rating.
# Built-in defaults. Values only: each key's kind, range, levels and
# label stay in the registry (`src/defaults/`), so this file cannot widen what is allowed.
# Keys under [values] are registry keys; lengths are millimetres. [fields.<catalogue>] are a style
# field's built-in, [styles.<catalogue>.<id>] a built-in style's values.

[values]
"rating.wire_basis" = "datasheet"
"rating.cable_basis" = "table"
"rating.panel_temperature" = 40.0
"rating.ambient" = 30.0
"rating.table" = "none"
"rating.bundling" = "none"
"rating.method" = "E"
"rating.voltage" = 400.0
"rating.system" = "ac3"
"rating.vd_limit" = 5.0
"rating.supply_tolerance" = 5.0
"rating.template.power_supply" = "voltages, current, power"
"rating.template.protection" = "curve, current, class, residual, breaking, poles, outputs"
"rating.template.switching" = "control, ac3_current, ac3_power"
"rating.template.sensor" = "supply"
"rating.template.motor" = "power, voltage, current, frequency, power_factor, efficiency, starting"
"rating.template.load" = "power"
"rating.template.indicator" = "colour, signal, voltage, power"
