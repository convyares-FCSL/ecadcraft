# Brief 054: cover page and page defaults.
# Built-in defaults (brief 066, design 066 §3). Values only: each key's kind, range, levels and
# label stay in the registry (`src/defaults/`), so this file cannot widen what is allowed.
# Keys under [values] are registry keys; lengths are millimetres. [fields.<catalogue>] are a style
# field's built-in, [styles.<catalogue>.<id>] a built-in style's values.

[values]
"page.type" = "schematic"
"front.cover.notes" = "on"
"front.cover.wire_colours" = "on"
"front.cover.symbol_legend" = "on"
"front.cover.revisions" = "on"
"front.cover.structure_codes" = "off"
"front.cover.customer_site" = "on"
"front.cover.heading" = "Electrical documentation"

# Built-in layout values no level overrides (brief 066c).
[layout]
"page.report.row_height" = 5.0     # ecad.table-row: rows per A3 sheet are computed from these
"page.report.header_height" = 7.0  # ecad.table-header
