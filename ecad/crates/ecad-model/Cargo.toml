[package]
name = "ecad-model"
description = "ECAD document model: objects, typed IDs, ops, transactions and history (no CADCraft dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
strum = { workspace = true }
# A revision's date is a calendar date (house rule: time goes through chrono).
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
# The index's two large maps are built side by side (design 061, lane R11).
rayon = { workspace = true }
# Command parameters' JSON Schemas (brief 070): type description, no I/O (owner, 2026-11-21).
schemars = { workspace = true }
# The built-in project settings are TOML data (brief 066c, `defaults/settings.toml`).
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
serde_json = { workspace = true }
# Turns on this crate's verify mode for its own tests (see the `verify-invariants` feature).
ecad-model = { path = ".", features = ["verify-invariants"] }

[features]
# Verify mode: after every transaction, also run the full invariant check and the index check and
# assert that they agree with the scoped check (brief 013). Every crate that depends on
# ecad-model enables it through its dev-dependencies, so every `cargo test` verifies while app
# builds, debug or release, take the fast path. `ECAD_VERIFY_INVARIANTS=1` turns it on at run time.
verify-invariants = []
