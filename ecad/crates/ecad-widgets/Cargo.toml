[package]
name = "ecad-widgets"
description = "ECAD's widgets: the screen tokens, the egui style built from them, the embedded fonts, the primitives and the icon painters; no ECAD knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# UiKit (ecad xtask layers): egui and ecad-drawing-style only; no `cadcraft-*` crate
# and no other ECAD crate, so the widgets stay swappable and test without wgpu.
# `egui_extras` draws the table's virtualised rows (U3, brief 039). The drawing style gives the
# sheet font and the sheet colours the gallery shows (design 065 §1.1).
[dependencies]
ecad-drawing-style = { workspace = true }
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }

[dev-dependencies]
# Headless widget tests by accessible label; no renderer (no `wgpu` feature).
egui_kittest = "=0.37.0"
# The fonts README's SHA-256 column is checked against the embedded bytes (already in the lock).
sha2 = "0.10"
