[package]
name = "ecad-store"
description = "Storage layer for ECAD files: the redb database handle (open, transactions, reopen), storage backends for tests, files on disk, writer locks (no file format)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The project file's engine: `db` opens the database and runs its transactions; the memory and
# power-loss backends implement its storage backend.
redb = { workspace = true }
# Lock records and history times as UTC dates (house rule: time goes through chrono).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
thiserror = { workspace = true }
# File identity (device and inode on Unix, volume serial and file index on Windows) without
# `unsafe` (BurntSushi, Unlicense OR MIT; owner approved 2026-10-31, brief 002).
same-file = "1.0.6"
