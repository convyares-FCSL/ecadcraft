[package]
name = "ecad-cadcraft"
description = "Adapter between the ECAD document and the CADCraft engine (provisional, proposal Part B)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Deliberate panics inside owner callbacks and ECAD commands, for the experiment's containment
# tests only. Never enabled in normal builds; `cargo xtask ci` tests with all features.
fault-injection = []
# `ProjectHandle::apply_ops`, for tests that build objects no command makes yet (brief 010's
# cable reference ends). Enabled only for tests, through the dev-dependencies below; never in a
# release or the desktop app (brief 009 review S3). Delete once brief 010's `cableref` is merged.
test-ops = []
# `test_support::ProjectBuilder` (brief 062): builds the small projects tests start from, with the same
# commands a user runs. Enabled only for tests (this crate's own, through the dev-dependencies below);
# never in a release or the desktop app.
test-support = []

[dependencies]
ecad-model = { workspace = true, features = ["schema"] }
ecad-store = { workspace = true }
ecad-file = { workspace = true }
ecad-inspect = { workspace = true }
# The electrical rules (design 065 §5 step 6), re-exported under their old module names.
ecad-electrical = { workspace = true }
# Brief 040: canvas colours and markers (`look::sheet`, `overlay_marks`), the sheet font and wire
# dashes, from the drawing style (design 065 §1.1).
ecad-drawing-style = { workspace = true }
cadcraft-engine = { path = "../../../crates/engine" }
# Brief 024: Print Book installs CADCraft's PDF plotter as the engine's plot hook (no PDF code in
# ECAD); already in the graph through `cadcraft-mcp`.
cadcraft-io = { path = "../../../crates/io" }
serde = { workspace = true }
serde_json = { workspace = true }
# Brief 020a: dates of the History tab (calendar only on every target; the zone below).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Brief 070: each command's parameters as a JSON Schema, from its params struct.
schemars = { workspace = true }

# Brief 020a: the History tab shows local time (overseer, 2026-11-10: chrono's `clock`, native
# only; a wasm build and a failed lookup show UTC, labelled).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
# Every test run checks invariants in full as well (verify mode, brief 013).
ecad-model = { workspace = true, features = ["verify-invariants"] }
cadcraft-ui-egui = { path = "../../../crates/ui-egui" }
# This crate's own tests see `apply_ops` and the test project builder.
ecad-cadcraft = { path = ".", features = ["test-ops", "test-support"] }
