[package]
name = "ecad-app"
description = "ECAD application: the shell, panels, dialogs and lists of the desktop trial (experiment only)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ecad-cadcraft = { path = "../../crates/ecad-cadcraft" }
ecad-inspect = { workspace = true }
ecad-model = { workspace = true }
ecad-file = { workspace = true }
# Brief 037: the style, fonts and primitives of ECAD's interface.
ecad-ui = { path = "../../crates/ecad-ui" }
# The sheet colours the canvas paints (design 065 §1.1).
ecad-drawing-style = { workspace = true }
cadcraft-ui-egui = { path = "../../../crates/ui-egui" }
# The same eframe build as CADCraft's desktop app (system clipboard included); `persistence`
# remembers the window's size and position (brief 023).
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
serde_json = { workspace = true }
# Brief 038: the shell state and page views in eframe storage.
serde = { workspace = true }
# Brief 035: upstream's control token; the included upstream control server names `egui` and
# `log` directly (eframe's versions). The shared write gate and tools are `ecad_cadcraft::agent`.
cadcraft-mcp = { path = "../../../crates/mcp" }
egui = { version = "0.37", default-features = false }
log = "0.4"
# The banner's clock (house rule: time goes through chrono).
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
# Every test run checks invariants in full as well (verify mode, brief 013).
ecad-model = { workspace = true, features = ["verify-invariants"] }
ecad-store = { workspace = true }
# The UI tests build brief 010's cable reference ends with `apply_ops` (test-only feature);
# brief 035's bridge tests make an ECAD command panic (fault injection).
ecad-cadcraft = { path = "../../crates/ecad-cadcraft", features = ["test-ops", "fault-injection"] }
# The same version CADCraft's UI tests use, to click the Tool Sets panel headless.
egui_kittest = "=0.37.0"
# The bridge and Checks tests run the MCP server (`ecad_mcp::EcadMcp`) against the window.
ecad-mcp = { path = "../../apps/ecad-mcp" }
# The tests that drive the command line and start-up timing reach them in ecad-desktop (design
# 065 §2.2); a dev-dependency only, so the library never depends on the program.
ecad-desktop = { path = "../../apps/ecad-desktop" }
# The tests name engine types beyond `ecad_cadcraft::cad` (design 065 §3, cut 11); the library does not.
cadcraft-engine = { path = "../../../crates/engine" }
