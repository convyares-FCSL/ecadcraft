[package]
name = "ecad-cli"
description = "ECAD's command-line tool: `ecad upgrade` (version 1 to 2 converter)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "ecad"
path = "src/main.rs"

[dependencies]
ecad-file = { workspace = true }

[dev-dependencies]
ecad-model = { workspace = true, features = ["verify-invariants"] }
ecad-store = { workspace = true }
serde_json = { workspace = true }
