[package]
name = "ecad-cli"
description = "ECAD's command-line tool `ecad` (no commands in this version)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "ecad"
path = "src/main.rs"

[dependencies]
# Verify mode: `main` passes the ECAD_VERIFY_INVARIANTS switch to the model (design 065 §3.1).
ecad-model = { workspace = true }

[dev-dependencies]
ecad-model = { workspace = true, features = ["verify-invariants"] }
