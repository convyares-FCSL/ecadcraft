[package]
name = "ecad-mcp"
description = "ECAD over MCP: CADCraft's MCP server composed with an ECAD project, headless (brief 011)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ecad-engine = { path = "../../crates/ecad-engine" }
ecad-model = { workspace = true }
cadcraft-mcp = { path = "../../../crates/mcp" }
serde_json = { workspace = true }

[dev-dependencies]
# Brief 021: tests read a version 2 file's history.
ecad-file = { workspace = true }
# The tests name electrical rules the engine used to re-export (0.2.3 structure move).
ecad-electrical = { workspace = true }
# The tests name engine types beyond `ecad_engine::cad` (design 065 §3, cut 11); the library does not.
cadcraft-engine = { path = "../../../crates/engine" }
# The bridge tests run the MCP server against the real window (#53: they lived in ecad-app's tests).
ecad-widgets = { path = "../../crates/ecad-widgets" }
ecad-app = { path = "../../crates/ecad-app" }
ecad-store = { workspace = true }
egui_kittest = "=0.37.0"
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
cadcraft-ui-egui = { path = "../../../crates/ui-egui" }
egui = { version = "0.37", default-features = false }
# The bridge tests make an ECAD command panic (fault injection) and build cable ends with `apply_ops`.
ecad-engine = { path = "../../crates/ecad-engine", features = ["test-ops", "fault-injection"] }
