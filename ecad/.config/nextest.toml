# cargo-nextest settings for the QA gate's full suite (.github/workflows/ci.yml). Local runs keep
# `cargo test` and `cargo xtask test-changed`; nextest is optional there.
#
# nextest runs every test in its own process, so the test binaries of all crates share the
# runner's cores instead of running one binary after another, and the slow set can be split
# across jobs (`--partition`). It does not run doctests: CI runs those with `cargo test --doc`.

[profile.default]
# Report a test that runs longer than this; never kill it (the jobs have their own timeouts).
slow-timeout = { period = "60s" }

# The QA gate on Linux: every test, no retries (a flaky test should fail the gate, not pass on a
# second try), every failure reported rather than stopping at the first, slow tests named in the
# summary, and a JUnit file for the run's artifacts.
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s" }
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# The QA gate on Windows: as `ci`, without the slow tests that only compute in memory (random-edit
# oracles, generated-tier equivalence, cap and numbering probes). They behave the same on every
# platform and run in the Linux jobs; on Windows the bench tier test alone took 37 of the job's
# 104 minutes (PR #99). Windows keeps every fast test and every slow test that touches the file
# system, child processes, settings files, printing or the UI. A new slow test runs on Windows
# until it is added here. Names are matched at the end, so the phase-end tidy-up (which drops the
# `lanes::lane_<NNN>::` prefix) does not change what is left out.
[profile.ci-windows]
retries = 0
fail-fast = false
slow-timeout = { period = "60s" }
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"
default-filter = """
not (
    test(/the_small_and_medium_tiers_are_the_same_both_ways$/)
    | test(/randomised_edits_on_the_small_project_give_the_ops_of_the_old_translation$/)
    | test(/tester_014_r3_random_edits_across_two_pages_match_the_oracle$/)
    | test(/random_edits_keep_locations_and_reports_equal_to_a_rebuild_long$/)
    | test(/tester_025_random_edits_keep_the_index_and_the_update_map$/)
    | test(/oracle_random_numbering_sequences_keep_tags_unique_and_fixed_tags_still$/)
    | test(/oracle_strict_high_water_after_undone_renumbers$/)
    | test(/ac8_max_cable_members_is_the_cap$/)
    | test(/r2_cableadd_cap_holds_for_the_whole_cable$/)
    | test(/random_ops_over_many_seeds_keep_nets_equal_to_a_fresh_build$/)
)
"""

[profile.ci-windows.junit]
path = "junit.xml"
