# The ECAD workspace. It is separate from CADCraft's root workspace on purpose: upstream files stay
# untouched, and CADCraft crates are used by path. See docs/document-architecture-proposal.md §8.
[workspace]
resolver = "3"
# `dev/` holds developer and test tools, never shipped (design 029 §12): product crates do not
# depend on them (`cargo xtask layers`).
members = ["crates/*", "apps/*", "dev/*", "xtask"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/convyares-FCSL/ecadcraft"

[workspace.dependencies]
ecad-model = { path = "crates/ecad-model" }
ecad-store = { path = "crates/ecad-store" }
ecad-inspect = { path = "crates/ecad-inspect" }
ecad-file = { path = "crates/ecad-file" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# Container v2 (brief 021, EEP-0005 §2.3): the redb version is pinned exactly; changing it is a
# deliberate change with its own review and tests, never a routine update.
redb = "=4.5.0"
# Zstandard (overseer, 2026-11-09): libzstd through `zstd` natively; `ruzstd` (pure Rust) decodes
# in the wasm reader. Both pinned; a change is a deliberate change with its own review.
zstd = "=0.13.4"
ruzstd = "=0.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

# Dependencies (crates.io and CADCraft's crates by path; not ECAD's own) are optimised: they are
# compiled once and cached, and egui and wgpu stay usable in tests and the trial.
[profile.dev.package."*"]
opt-level = 2

# ECAD's own crates build unoptimised for dev and test, so a change recompiles quickly (owner
# decision, 2026-11-08, brief 017). A test too slow at this level is marked slow, not optimised.
[profile.dev]
opt-level = 0

# Mirrors CADCraft's root [patch.crates-io] (CADCraft 0.19.0, ../Cargo.toml): patches apply only at a
# workspace root, and the CADCraft crates used by path need the same egui and winit forks.
# Re-copy on every upstream sync. Entries the ECAD graph does not use (hayro-syntax and hayro-jbig2)
# are left out; upstream itself dropped egui_demo_lib, egui_inspection and egui_system_font_provider
# in 0.18.0. egui_extras is used since CADCraft 0.18.0 (cadcraft-ui-egui). The PDF backend is used
# since brief 011: `ecad-mcp` uses `cadcraft-mcp`, whose `cadcraft-io` writes PDF (krilla).
[patch.crates-io]
krilla = { version = "=0.8.2", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
# Keep the complete egui family and native event bridge on reviewed fork commits.
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
