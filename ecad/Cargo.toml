# The ECAD workspace. It is separate from CADCraft's root workspace on purpose: upstream files stay
# untouched, and CADCraft crates are used by path. See docs/developer/architecture.md.
[workspace]
resolver = "3"
# `dev/` holds developer and test tools, never shipped: product crates do not
# depend on them (`cargo xtask layers`).
members = ["crates/*", "apps/*", "dev/*"]

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/convyares-FCSL/ecadcraft"

[workspace.dependencies]
ecad-model = { path = "crates/ecad-model" }
ecad-store = { path = "crates/ecad-store" }
ecad-file = { path = "crates/ecad-file" }
ecad-drawing-style = { path = "crates/ecad-drawing-style" }
ecad-electrical = { path = "crates/ecad-electrical" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# Command parameter schemas: the engine and ecad-electrical (each command's parameters struct).
schemars = "1.2"
# Words of the strict enums: `word()`, `parse()` and the word
# list derived from one attribute per variant. Derive only.
strum = { version = "0.28", features = ["derive"] }
# The container (docs/reference/file-format.md): the redb version is pinned exactly; changing it is a
# deliberate change with its own review and tests, never a routine update.
redb = "=4.5.0"
# Zstandard (overseer, 2026-11-09): libzstd through `zstd`. Pinned; a change is a deliberate
# change with its own review.
zstd = "=0.13.4"
# Per-chunk and per-page work in parallel, and the app's background pool:
# MIT OR Apache-2.0, the version CADCraft's `cadcraft-render` already links. Results come back in
# input order; closures return `Result` and never panic.
rayon = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
private_interfaces = "deny"
private_bounds = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

# Dependencies (crates.io and CADCraft's crates by path; not ECAD's own) are optimised: they are
# compiled once and cached, and egui and wgpu stay usable in tests and the app.
[profile.dev.package."*"]
opt-level = 2
# Smaller debug builds (owner, 2026-11-14): build folders were reaching 30-60 GB.
debug = false

# ECAD's own crates build unoptimised for dev and test, so a change recompiles quickly (owner
# decision, 2026-11-08). A test too slow at this level is marked slow, not optimised.
[profile.dev]
opt-level = 0
# File and line in backtraces, without full debug info (build folders were reaching 30-60 GB).
debug = "line-tables-only"

# Mirrors CADCraft's root [patch.crates-io] (../Cargo.toml, the commit in UPSTREAM.md): patches apply
# only at a workspace root, and the CADCraft crates used by path need the same egui and winit forks
# and the same PDF backends. Re-copy on every upstream sync. `cadcraft-io` writes PDF (krilla) and
# `cadcraft-engine` imports PDF pages (the hayro readers).
[patch.crates-io]
krilla = { version = "=0.8.2", git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "453b0da782ccef39be9a6dac8d27c80b553ef1cc" }
# Keep the complete egui family and native event bridge on reviewed fork commits.
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
